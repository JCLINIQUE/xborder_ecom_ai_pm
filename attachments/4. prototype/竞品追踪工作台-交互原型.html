    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
(function(){
  const root=document.getElementById(&#x27;tracking-proto&#x27;);
  const q=s=&gt;root.querySelector(s);
  const labels=[&#x27;发现了什么&#x27;,&#x27;为什么值得关注&#x27;,&#x27;还需核实什么&#x27;,&#x27;可以考虑什么方向&#x27;];
  const design={sourcePlacement:&#x27;side&#x27;};
  let state, timers=[];
  const money=n=&gt;Number(n).toLocaleString(&#x27;en-US&#x27;);
  function later(fn){const id=setTimeout(fn,650);timers.push(id);}
  function tell(text){q(&#x27;#cp-notice&#x27;).textContent=text;}
  function fieldsFor(s){
    const conditional=11800-s.coupon, diff=conditional-10800;
    const position=diff===0?&#x27;与自家标价相同&#x27;:`比自家标价${diff&lt;0?&#x27;低&#x27;:&#x27;高&#x27;} ${money(Math.abs(diff))} 日元`;
    return [
      `竞品两期标价均为 11,800 日元〔A-1、A-2〕，本次展示 ${money(s.coupon)} 日元券，资格与期限未知〔${s.coupon===2000?&#x27;A-2&#x27;:&#x27;A-2-R&#x27;}〕。`+(s.oldAvailable?&#x27;旧页面未展示券，两次优惠展示不同〔A-1-I、A-2〕。&#x27;:&#x27;旧券字段未采集，尚无法确认是否新增优惠〔A-1；A-1-I 缺失〕。&#x27;),
      `若券适用，程序计算为 ${money(conditional)} 日元，${position}〔${s.coupon===2000?&#x27;A-2&#x27;:&#x27;A-2-R&#x27;}、S-1/2〕。可能影响可享优惠买家的价格比较；不据此认定清库存或抢走自家销量。`,
      (s.oldAvailable?&#x27;先核券资格与期限〔A-2 缺项〕&#x27;:&#x27;先补旧页面证据，区分新增优惠与旧记录漏采〔A-1-I 缺失〕，再核券资格与期限〔A-2 缺项〕&#x27;)+&#x27;；补自家同期销量、转化、广告和利润约束〔S-1/2 未提供〕。&#x27;,
      &#x27;可先核实优惠条件，信息不足时继续观察；优惠适用且自家经营与利润约束支持时，再评估促销方案。当前不足以直接给出跟价结论。&#x27;
    ];
  }
  function fillParagraphs(element,fields){
    element.replaceChildren();fields.forEach((text,i)=&gt;{const p=document.createElement(&#x27;p&#x27;),b=document.createElement(&#x27;strong&#x27;);b.textContent=labels[i]+&#x27;：&#x27;;p.append(b,document.createTextNode(text));element.append(p);});
  }
  function eligible(){return state.verified&amp;&amp;state.aiStatus===&#x27;reviewed&#x27;&amp;&amp;state.aiVersion===state.version&amp;&amp;!state.aiBusy;}
  function renderSource(){
    const open=Boolean(state.source);q(&#x27;#cp-source&#x27;).hidden=!open;
    q(&#x27;#cp-source&#x27;).classList.toggle(&#x27;cp-inline&#x27;,design.sourcePlacement===&#x27;inline&#x27;);
    q(&#x27;#cp-layout&#x27;).classList.toggle(&#x27;cp-source-open&#x27;,open&amp;&amp;design.sourcePlacement===&#x27;side&#x27;);
    if(!open)return;
    const sources={
      excel:[&#x27;跟踪记录.xlsx · 工作表「日跟踪」&#x27;,&#x27;A-1：第 2 行，2026-09-10 10:00 JST，竞品 A 标价 11,800；优惠未采集。S-1/2：第 3–4 行，自家 S 两期标价均 10,800，经营指标未提供。&#x27;,&#x27;教学模拟。B 列为观察时间，D 列为标价，E 列为优惠状态；不是实时平台数据。&#x27;],
      old:[&#x27;竞品旧页面.png · A-1-I&#x27;,state.oldAvailable?&#x27;截图区域「价格与促销」：2026-09-10 10:00 JST，11,800 日元；页面未展示券。&#x27;:&#x27;A-1 的 Excel 记录仍保留；旧截图当前不可用。优惠字段未采集，不能填 0 或认定没有券。&#x27;,state.oldAvailable?&#x27;教学模拟。已关联同站点、同 ASIN／变体、同卖家与时点。&#x27;:state.fileFailure?&#x27;识读失败：图片模糊。可以单独重试，不影响 Excel 与 Word。&#x27;:&#x27;该证据已撤去。旧解读仅作历史保留。&#x27;],
      current:[&#x27;本次促销记录.docx · A-2&#x27;,&#x27;表格 1 第 2 行：2026-09-11 10:00 JST，标价 11,800 日元，展示 2,000 日元券；资格与期限未知。&#x27;+(state.coupon!==2000?` 补充截图 A-2-R（教学模拟）将券面额更正为 ${money(state.coupon)}；原 Word 值保留。`:&#x27;&#x27;),&#x27;教学模拟。当前使用的修订值需人工重新核对；并未访问商品链接。&#x27;]
    };
    const item=sources[state.source];q(&#x27;#cp-source-title&#x27;).textContent=item[0];q(&#x27;#cp-source-quote&#x27;).textContent=item[1];q(&#x27;#cp-source-note&#x27;).textContent=item[2];
  }
  function renderExport(){
    if(!state.exportOpen)return;
    const wrap=q(&#x27;#cp-export-table&#x27;);wrap.replaceChildren();
    const table=document.createElement(&#x27;table&#x27;),head=document.createElement(&#x27;thead&#x27;),body=document.createElement(&#x27;tbody&#x27;);
    const headings=[&#x27;记录&#x27;,&#x27;标价（日元）&#x27;,&#x27;优惠展示&#x27;,&#x27;核对状态 / 来源&#x27;];
    const tr=document.createElement(&#x27;tr&#x27;);headings.forEach(t=&gt;{const th=document.createElement(&#x27;th&#x27;);th.textContent=t;tr.append(th);});head.append(tr);
    const priceStatus=state.priceVerified?&#x27;标价已核对&#x27;:&#x27;标价待核对&#x27;;
    const oldStatus=state.oldAvailable?(state.verified?&#x27;优惠展示已核对&#x27;:&#x27;优惠展示待核对&#x27;):&#x27;优惠未采集&#x27;;
    const currentStatus=state.verified?&#x27;券面额已核对，条件未知&#x27;:&#x27;券面额待核对，条件未知&#x27;;
    const rows=[[&#x27;A · 09-10 10:00&#x27;, &#x27;11,800&#x27;,state.oldAvailable?&#x27;页面未展示券&#x27;:&#x27;未采集；旧截图不可用&#x27;,priceStatus+&#x27;；&#x27;+oldStatus+&#x27; · A-1&#x27;+(state.oldAvailable?&#x27; / A-1-I&#x27;:&#x27;&#x27;)],[&#x27;A · 09-11 10:00&#x27;,&#x27;11,800&#x27;,money(state.coupon)+&#x27; 日元券；条件未知&#x27;,priceStatus+&#x27;；&#x27;+currentStatus+&#x27; · &#x27;+(state.coupon===2000?&#x27;A-2&#x27;:&#x27;A-2 / A-2-R&#x27;)],[&#x27;S · 09-10 / 09-11&#x27;,&#x27;10,800&#x27;,&#x27;未提供&#x27;,priceStatus+&#x27;；优惠未提供 · S-1/2&#x27;]];
    rows.forEach(row=&gt;{const r=document.createElement(&#x27;tr&#x27;);row.forEach(t=&gt;{const td=document.createElement(&#x27;td&#x27;);td.textContent=t;r.append(td);});body.append(r);});table.append(head,body);wrap.append(table);
    q(&#x27;#cp-export-ai&#x27;).disabled=!eligible();if(!eligible())q(&#x27;#cp-export-ai&#x27;).checked=false;
    q(&#x27;#cp-export-reason&#x27;).textContent=eligible()?&#x27;可选附带：当前范围的已复核解读，保留条件、引用及生成时间。&#x27;:&#x27;当前只预览数据。解读须依据未变且已复核，才能附带；这不阻止数据导出。&#x27;;
    const withAI=q(&#x27;#cp-export-ai&#x27;).checked&amp;&amp;eligible();q(&#x27;#cp-export-analysis&#x27;).hidden=!withAI;
    if(withAI){fillParagraphs(q(&#x27;#cp-export-analysis&#x27;),state.fields);const p=document.createElement(&#x27;p&#x27;);p.className=&#x27;cp-muted&#x27;;p.textContent=`模拟解读 · 数据版本 v${state.aiVersion} · 生成于 ${state.generatedAt} · 条件仍需核实`;q(&#x27;#cp-export-analysis&#x27;).append(p);}
  }
  function render(){
    q(&#x27;#cp-prep&#x27;).hidden=state.page!==&#x27;prep&#x27;;q(&#x27;#cp-work&#x27;).hidden=state.page!==&#x27;work&#x27;;
    root.querySelectorAll(&#x27;[data-page]&#x27;).forEach(b=&gt;{b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.page===state.page));b.disabled=b.dataset.page===&#x27;work&#x27;&amp;&amp;!state.extracted;});
    root.querySelectorAll(&#x27;[data-scenario]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.scenario===state.scenario)));
    q(&#x27;#cp-prep-file-state&#x27;).textContent=state.scenario===&#x27;partial&#x27;?&#x27;本路径模拟：旧截图识读失败，其他材料继续。&#x27;:&#x27;&#x27;;
    q(&#x27;#cp-extract&#x27;).disabled=state.extracting;q(&#x27;#cp-extract&#x27;).textContent=state.extracting?&#x27;正在提取示例…&#x27;:state.extracted?&#x27;回到当前工作台&#x27;:&#x27;提取示例资料&#x27;;
